name: Publish Sponsors to README 📣
on:
  workflow_dispatch:
  schedule:
    - cron: 30 15 * * 1,4

permissions:
  contents: write

jobs:
  generate-sponsors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate Sponsors 💖
        uses: JamesIves/github-sponsors-readme-action@02650b8cd445fc16dfef73195f9c406dce041623 # v1.6.1
        with:
          token: ${{ secrets.PAT }}
          file: 'README.md'
          template: '<a href="https://github.com/{{{ login }}}"><img src="https://github.com/{{{ login }}}.png" width="50px" alt="{{{ login }}}" /></a>&nbsp;&nbsp;'
          maximum: 2499
          active-only: false
          include-private: true

      - name: Generate Sponsors 💖
        uses: JamesIves/github-sponsors-readme-action@02650b8cd445fc16dfef73195f9c406dce041623 # v1.6.1
        with:
          token: ${{ secrets.PAT }}
          file: 'README.md'
          minimum: 2500
          template: '<a href="https://github.com/{{{ login }}}"><img src="https://github.com/{{{ login }}}.png" width="80px" alt="{{{ login }}}" /></a>&nbsp;&nbsp;'
          marker: 'premium'
          active-only: false
          include-private: true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: dev
          folder: '.'
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es
