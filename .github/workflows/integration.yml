name: Integration Tests 🧪
on:
  workflow_call:
    inputs:
      action-ref:
        description: 'The github-pages-deploy-action ref (tag, branch, or SHA) to validate.'
        required: false
        type: string
        default: 'v4'
  workflow_dispatch:
    inputs:
      action-ref:
        description: 'The github-pages-deploy-action ref (tag, branch, or SHA) to validate.'
        required: false
        type: string
        default: 'v4'
  schedule:
    - cron: 30 15 * * 0-6

permissions:
  contents: write

jobs:
  integration-cross-repo-push:
    container: node:24
    runs-on: ubuntu-latest
    steps:
      - name: Install Container Dependencies 📚
        run: |
          apt-get update && apt-get install -y rsync

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es
          repository-name: MontezumaIves/lab
          token: ${{ secrets.ACCESS_TOKEN }}
          commit-message: 'Test commit'
          folder: integration
          single-commit: true
          clean: true
          silent: false

  integration-checkout-v1:
    needs: integration-cross-repo-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          folder: integration
          target-folder: cat/montezuma
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es
          silent: false

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages

  integration-checkout-v2:
    needs: integration-checkout-v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          folder: integration
          target-folder: cat/montezuma2
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages

  # Deploys using a container that requires you to install rsync.
  integration-container:
    needs: integration-checkout-v2
    runs-on: ubuntu-latest
    container:
      image: ruby:3.3
      env:
        LANG: C.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Install rsync
        run: |
          apt-get update && apt-get install -y rsync

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          folder: integration
          target-folder: cat/montezuma2
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages

  # Deploys using an SSH key.
  integration-ssh:
    needs: integration-container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          folder: integration
          target-folder: cat/montezuma3
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages

  # Deploys using an SSH key.
  integration-ssh-third-party-client:
    needs: integration-ssh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Install SSH Client
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          ssh-key: true
          folder: integration
          target-folder: cat/montezuma4
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages

  # Deploys using a custom env. (Includes subsequent commit)
  integration-env:
    needs: integration-ssh-third-party-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          folder: integration
          target-folder: cat/montezuma4
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          folder: integration
          target-folder: cat/subsequent
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages

  # Deploys using the CLEAN option.
  integration-clean:
    needs:
      [
        integration-checkout-v1,
        integration-checkout-v2,
        integration-container,
        integration-ssh,
        integration-ssh-third-party-client,
        integration-env
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          folder: integration
          clean: true
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

  # Deploys to a branch that doesn't exist with SINGLE_COMMIT. (Includes subsequent commit)
  integration-branch-creation:
    needs: integration-clean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-delete-prod
          folder: integration
          single-commit: true
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-delete-prod
          folder: integration
          single-commit: true
          target-folder: jives
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: integration-test-delete-prod

  # Creates two competing deployments, one of which should rebase over the other.
  # First conflicting deployment
  integration-rebase-conflicts-1:
    needs: integration-branch-creation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Create random file
        run: echo $RANDOM > integration/1

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es
          repository-name: MontezumaIves/lab
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: gh-pages-rebase-conflict
          folder: integration
          force: false

  # Second conflicting deployment
  integration-rebase-conflicts-2:
    needs: integration-rebase-conflicts-1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Create random file
        run: echo $RANDOM > integration/2

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es
          repository-name: MontezumaIves/lab
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: gh-pages-rebase-conflict
          folder: integration
          force: false

  # Clean up conflicting deployments
  integration-rebase-conflicts-cleanup:
    needs: [integration-rebase-conflicts-1, integration-rebase-conflicts-2]
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: MontezumaIves/lab
          branch: gh-pages

  integration-root-folder:
    needs: integration-rebase-conflicts-cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Echo
        working-directory: integration
        run: |
          echo "Here"

      - name: Build and Deploy
        uses: ./action-under-test
        with:
          folder: .
          target-folder: cat/montezuma5
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages

  # Deploys with dry-run and verifies the branch was never actually pushed.
  integration-dry-run:
    needs: integration-root-folder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Build and Deploy (Dry Run)
        uses: ./action-under-test
        with:
          branch: integration-test-dry-run
          folder: integration
          dry-run: true
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Verify the dry-run did not push a branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/branches/integration-test-dry-run)
          if [ "$status" != "404" ]; then
            echo "Expected branch to NOT exist after a dry-run, got HTTP $status"
            exit 1
          fi

  # Deploys with a tag and verifies the tag was pushed.
  integration-tag:
    needs: integration-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Build and Deploy with a Tag
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-tag-branch
          folder: integration
          single-commit: true
          tag: integration-test-${{ github.run_id }}
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Verify the tag was pushed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/tags/integration-test-${{ github.run_id }})
          [ "$status" == "200" ] || { echo "Expected tag to exist, got HTTP $status"; exit 1; }

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: integration-test-tag-branch

      - name: Cleanup Generated Tag
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/tags/integration-test-${{ github.run_id }}

  # Deploys twice to the same branch, using clean-exclude to protect a file
  # from the second deploy's --delete clean pass.
  integration-clean-exclude:
    needs: integration-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Create excluded fixture file
        run: echo "keep me" > integration/keep-me.txt

      - name: Initial Deploy (includes keep-me.txt)
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-clean-exclude
          folder: integration
          clean: true
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Remove the fixture file locally before the second deploy
        run: rm integration/keep-me.txt

      - name: Second Deploy with clean-exclude protecting keep-me.txt
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-clean-exclude
          folder: integration
          clean: true
          clean-exclude: |
            keep-me.txt
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Verify keep-me.txt survived the clean
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/keep-me.txt?ref=integration-test-clean-exclude")
          [ "$status" == "200" ] || { echo "Expected keep-me.txt to survive, got HTTP $status"; exit 1; }

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: integration-test-clean-exclude

  # Deploys twice to the same branch with clean: false, expecting a stale
  # file from the first deploy to survive the second.
  integration-clean-false:
    needs: integration-clean-exclude
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Create stale fixture file
        run: echo "stale" > integration/stale-me.txt

      - name: Initial Deploy (includes stale-me.txt)
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-clean-false
          folder: integration
          clean: true
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Remove the fixture file locally before the second deploy
        run: rm integration/stale-me.txt

      - name: Second Deploy with clean disabled
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-clean-false
          folder: integration
          clean: false
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Verify stale-me.txt survived because clean was disabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/contents/stale-me.txt?ref=integration-test-clean-false")
          [ "$status" == "200" ] || { echo "Expected stale-me.txt to survive, got HTTP $status"; exit 1; }

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: integration-test-clean-false

  # Combines force: false with single-commit: true, a combination never
  # exercised elsewhere (existing single-commit jobs default force: true).
  integration-force-false-single-commit:
    needs: integration-clean-false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: First Deploy
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-force-false-single-commit
          folder: integration
          single-commit: true
          force: false
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Second Deploy (should rebase cleanly onto the orphan history)
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-force-false-single-commit
          folder: integration
          single-commit: true
          force: false
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: integration-test-force-false-single-commit

  # Deploys without git-config-name/git-config-email, verifying the
  # default GitHub-context-derived author is resolved rather than crashing.
  integration-default-git-config:
    needs: integration-force-false-single-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Build and Deploy without a custom git-config-name/email
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-default-git-config
          folder: integration
          single-commit: true
          silent: false

      - name: Verify a non-empty author was resolved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          author_name=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/integration-test-default-git-config" \
            | jq -r '.commit.author.name // empty')
          if [ -z "$author_name" ]; then
            echo "Expected a non-empty default commit author name"; exit 1
          fi
          echo "Resolved default author: $author_name"

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: integration-test-default-git-config

  # Deploys using a ~-prefixed absolute folder path, per the documented
  # "utilize absolute file paths by prepending ~" behavior.
  integration-tilde-folder:
    needs: integration-default-git-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Populate a folder outside the workspace
        run: |
          mkdir -p ~/integration-tilde-test
          cp -r integration/. ~/integration-tilde-test/

      - name: Build and Deploy from a ~-prefixed folder
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-tilde-folder
          folder: ~/integration-tilde-test
          single-commit: true
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Cleanup Generated Branch
        uses: ./.github/actions/delete-branch
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: integration-test-tilde-folder

  # Deploys with a folder that doesn't exist, expecting checkParameters's
  # own validation to fail the step cleanly rather than a runner-generic error.
  integration-invalid-input:
    needs: integration-tilde-folder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Action Under Test
        uses: actions/checkout@v7.0.1
        with:
          repository: JamesIves/github-pages-deploy-action
          ref: ${{ inputs.action-ref || 'v4' }}
          path: action-under-test
          persist-credentials: false

      - name: Attempt to deploy a folder that does not exist
        id: invalid-folder
        continue-on-error: true
        uses: ./action-under-test
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          branch: integration-test-invalid-input
          folder: this-directory-does-not-exist
          silent: false
          git-config-name: Montezuma
          git-config-email: montezuma@jamesiv.es

      - name: Verify the step failed cleanly
        if: steps.invalid-folder.outcome != 'failure'
        run: |
          echo "Expected the step to fail for a non-existent folder"; exit 1
