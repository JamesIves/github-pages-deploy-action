name: Update Major Version Tag and Publish to Registry 📦

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  update-majorver:
    name: Update Major Version Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: nowactions/update-majorver@f2014bbbba95b635e990ce512c5653bd0f4753fb # v1.1.2

  call-integration-workflow:
    name: Verify Major Tag 🚀
    needs: update-majorver
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/integration.yml

  update-registries:
    needs: call-integration-workflow
    name: Publish to Registries 📦
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          scope: '@jamesives'

      - name: Configure Git
        run: |
          git config user.email "iam@jamesiv.es"
          git config user.name "James Ives"

      - run: npm ci
      - run: npm run build
      - run: git stash
      - name: Set version to match the tag
        continue-on-error: true
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION -m "Release $VERSION 📣"
        env:
          GITHUB_REF: ${{ github.ref }}
      - run: git push

      # Publish to npm
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Setup .npmrc file to publish to GitHub Packages
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jamesives'

      - name: Authenticate with the GitHub Package Registry
        run: |
          echo "//npm.pkg.github.com:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc

      # Publish to GitHub Packages
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
